# AstralChat docker-compose — intended for YOUR server deployment.
# The referenced .env.docker file must live on the host (it's gitignored)
# and contains the real AWS / Cognito / DynamoDB values.
#
# Usage:
#   cp .env.docker.example .env.docker   # then fill in real values
#   docker compose up -d --build

services:
  astralchat:
    build:
      context: .
      dockerfile: Dockerfile
    image: astralchat:latest
    container_name: astralchat
    restart: unless-stopped
    env_file:
      - .env.docker
    # AWS credentials: this container runs a DELIBERATELY VULNERABLE app, so it
    # must never see your personal ~/.aws folder (every profile you own).
    # Mount a dedicated, least-privilege credentials file instead — see
    # "Minimal runtime IAM policy" in the README. `.aws-runtime/` is gitignored.
    # On an AWS host with an instance/task role, remove this block and the
    # SDK will use the role (enforce IMDSv2 with hop limit 1).
    volumes:
      - ./.aws-runtime:/aws:ro
    environment:
      # Absolute paths — the container's runtime user is `nextjs` (uid 1001)
      # and may not have $HOME set the way the SDK expects.
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
      AWS_PROFILE: ${AWS_PROFILE:-astralchat-runtime}
    # Only expose on 127.0.0.1 — front the container with a reverse proxy
    # or Cloudflare Tunnel rather than exposing port 3000 publicly.
    ports:
      - "127.0.0.1:3000:3000"
    # Drop capabilities — this is a deliberately vulnerable app.
    # The less the container can do on the host, the safer running it is.
    security_opt:
      - no-new-privileges:true
    read_only: false
